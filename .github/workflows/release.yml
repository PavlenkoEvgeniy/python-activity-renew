name: Release

# Сборка запускается при публикации релиза на GitHub. Кнопка «Run workflow»
# нужна для проверки сборки без релиза: артефакты тогда просто лежат в прогоне.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Юнит-тесты
        run: python3 -m unittest discover -s tests -t . -v

  binary:
    name: Бинарник (PyInstaller, x86_64)
    needs: tests
    # Собираем на самой старой из поддерживаемых Ubuntu: чем старее glibc у
    # сборки, тем на большем числе систем бинарник заведётся.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Системные модули
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-tk python3-dbus python3-evdev

      - name: Сборка бинарника
        run: |
          # --system-site-packages: tkinter, dbus и evdev взяты из apt, а не из pip
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pyinstaller
          .venv/bin/pyinstaller \
            --onefile \
            --name activity-renew \
            --collect-submodules dbus \
            --hidden-import evdev \
            main.py

      - name: Бинарник запускается
        # Проверяет, что внутрь уехали python, tkinter и dbus: до argparse дело
        # доходит только если все импорты на месте.
        run: ./dist/activity-renew --version

      - uses: actions/upload-artifact@v4
        with:
          name: activity-renew-binary
          path: dist/activity-renew
          if-no-files-found: error

  deb:
    name: Пакет .deb
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Версия из тега
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="0.0.0+$(git rev-parse --short HEAD)"
          fi
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Сборка пакета
        run: bash packaging/build_deb.sh "${{ steps.version.outputs.value }}"

      - name: Что внутри пакета
        # --info и --contents — два разных действия, dpkg-deb принимает только
        # одно за вызов: вместе они дают «two commands specified» и код 2.
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Пакет ставится и запускается
        # Ставим по-настоящему и запускаем из нейтрального каталога. Если
        # запускать из корня репозитория, python найдёт исходники в текущей
        # папке и проверка не докажет ничего — ровно на этом уже уехал
        # нерабочий релиз 0.1.0 (каталог в dist-packages назывался через дефис).
        run: |
          sudo apt-get install -y ./dist/activity-renew_*_all.deb
          cd /tmp
          activity-renew --version

      - uses: actions/upload-artifact@v4
        with:
          name: activity-renew-deb
          path: dist/*.deb
          if-no-files-found: error

  publish:
    name: Приложить к релизу
    needs: [binary, deb]
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Контрольные суммы
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Приложить файлы к релизу
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # В этом job'е нет checkout, поэтому git-дерева тоже нет — сам gh
          # репозиторий не определит и падает на «not a git repository».
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
